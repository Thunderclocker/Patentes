name: Apply round recovery

on:
  push:
    branches:
      - carter/fix-estacionascan-20260922
    paths:
      - .github/workflows/apply-round-recovery.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: carter/fix-estacionascan-20260922
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply safe patch
        run: node scripts/patch-round-recovery.mjs control_de_estacionamiento.html
      - name: Run regression suite
        run: npm test
      - name: Commit verified HTML and remove temporary workflow
        run: |
          git config user.name "Carter"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control_de_estacionamiento.html
          git rm .github/workflows/apply-round-recovery.yml
          git commit -m "Proteger y restaurar la última ronda"
          git push origin HEAD:carter/fix-estacionascan-20260922
