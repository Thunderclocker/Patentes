name: Carter patch ronda
on:
  push:
    branches:
      - carter/fix-estacionascan-20260922
    paths:
      - .github/workflows/carter-patch-ronda.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: carter/fix-estacionascan-20260922
      - name: Patch nuevaRonda
        shell: python
        run: |
          from pathlib import Path
          p = Path('control_de_estacionamiento.html')
          s = p.read_text(encoding='utf-8')
          old = '''            if (confirm("¿Estás seguro de iniciar una nueva ronda?\\nEsto borrará todos los registros guardados en esta pantalla de forma permanente.")) {
                registros = [];
                localStorage.removeItem('ronda_estacionamiento');
                renderizarRegistros();
                mostrarToast("¡Nueva ronda iniciada!");
            }'''
          new = '''            if (confirm("¿Estás seguro de iniciar una nueva ronda?\\nLa ronda actual quedará guardada como copia de recuperación antes de limpiar la pantalla.")) {
                const rondaActual = localStorage.getItem('ronda_estacionamiento');
                if (!rondaActual) {
                    mostrarToast("No se pudo leer la ronda actual. No se borró nada.");
                    return;
                }

                try {
                    localStorage.setItem('ultima_ronda_recuperacion', rondaActual);
                    const copiaVerificada = localStorage.getItem('ultima_ronda_recuperacion');
                    if (copiaVerificada !== rondaActual) {
                        throw new Error('La copia de recuperación no coincide con la ronda actual');
                    }
                } catch (e) {
                    console.error("No se pudo guardar la copia de recuperación:", e);
                    mostrarToast("No se pudo crear la copia de recuperación. No se borró nada.");
                    return;
                }

                registros = [];
                localStorage.removeItem('ronda_estacionamiento');
                renderizarRegistros();
                mostrarToast("Nueva ronda iniciada. La anterior quedó respaldada.");
            }'''
          if old not in s:
              raise SystemExit('Bloque esperado no encontrado; no se modifica el archivo')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Verificar barrera
        run: |
          grep -q "localStorage.setItem('ultima_ronda_recuperacion', rondaActual)" control_de_estacionamiento.html
          grep -q "const copiaVerificada = localStorage.getItem('ultima_ronda_recuperacion')" control_de_estacionamiento.html
          grep -q "localStorage.removeItem('ronda_estacionamiento')" control_de_estacionamiento.html
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control_de_estacionamiento.html
          git diff --cached --quiet && exit 0
          git commit -m "Evitar pérdida de ronda al reiniciar"
          git push origin HEAD:carter/fix-estacionascan-20260922
