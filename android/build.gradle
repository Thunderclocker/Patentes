// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// OneDrive puede bloquear archivos temporales de Gradle en Windows. El script
// de build define esta ruta fuera de la carpeta sincronizada.
def externalBuildDir = System.getenv('ESTACIONASCAN_BUILD_DIR')
if (externalBuildDir) {
    rootProject.layout.buildDirectory.set(file("${externalBuildDir}/root"))
    subprojects {
        layout.buildDirectory.set(file("${externalBuildDir}/${project.name}"))
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
